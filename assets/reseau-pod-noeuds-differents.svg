<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Chemin réseau complet d'un pod A vers un pod B situés sur deux nœuds différents</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-size: 16px; font-weight: 700; }
      .s { font-size: 13.5px; }
      .ip { font-size: 13.5px; font-family: 'JetBrains Mono', Consolas, monospace; }
      .arr { stroke: #444441; stroke-width: 1.5; fill: none; }
      .badge circle { fill: #326ce5; }
      .badge text { fill: #fff; font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <!-- CoreDNS -->
  <rect x="440" y="16" width="240" height="68" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/>
  <text x="560" y="43" text-anchor="middle" class="t" fill="#085041">CoreDNS (kube-system)</text>
  <text x="560" y="66" text-anchor="middle" class="ip" fill="#0f6e56">svc-b → 10.96.12.34</text>
  <path d="M300 156 L300 50 L436 50" fill="none" stroke="#1d9e75" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#a)" marker-end="url(#a)"/>
  <g class="badge"><circle cx="370" cy="50" r="11"/><text x="370" y="54.5" text-anchor="middle">1</text></g>

  <!-- Nœud 1 -->
  <rect x="20" y="110" width="520" height="410" rx="16" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="8 5"/>
  <text x="40" y="140" class="t" font-size="18" fill="#2c2c2a">Nœud 1</text>

  <rect x="200" y="160" width="200" height="64" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="1.5"/>
  <text x="300" y="186" text-anchor="middle" class="t" fill="#3c3489">Pod A</text>
  <text x="300" y="208" text-anchor="middle" class="ip" fill="#534ab7">10.244.1.5</text>

  <rect x="50" y="250" width="460" height="190" rx="12" fill="#f1efe8" stroke="#888780"/>
  <text x="66" y="272" class="s" fill="#5f5e5a">Namespace réseau de l'hôte</text>

  <rect x="170" y="286" width="260" height="60" rx="8" fill="#faeeda" stroke="#854f0b"/>
  <text x="300" y="311" text-anchor="middle" class="t" fill="#633806">DNAT (kube-proxy)</text>
  <text x="300" y="332" text-anchor="middle" class="ip" fill="#854f0b">10.96.12.34 → 10.244.2.7</text>
  <g class="badge"><circle cx="145" cy="316" r="11"/><text x="145" y="320.5" text-anchor="middle">2</text></g>

  <rect x="170" y="366" width="260" height="60" rx="8" fill="#faeeda" stroke="#854f0b"/>
  <text x="300" y="391" text-anchor="middle" class="t" fill="#633806">Routage + encapsulation</text>
  <text x="300" y="412" text-anchor="middle" class="s" fill="#854f0b">VXLAN vers le nœud 2</text>
  <g class="badge"><circle cx="145" cy="396" r="11"/><text x="145" y="400.5" text-anchor="middle">3</text></g>

  <rect x="200" y="460" width="200" height="44" rx="8" fill="#fff" stroke="#888780"/>
  <text x="300" y="487" text-anchor="middle" class="ip" fill="#2c2c2a">eth0 192.168.0.11</text>

  <line x1="300" y1="226" x2="300" y2="282" class="arr" marker-end="url(#a)"/>
  <text x="310" y="242" class="s" fill="#5f5e5a">veth</text>
  <line x1="300" y1="348" x2="300" y2="362" class="arr" marker-end="url(#a)"/>
  <line x1="300" y1="428" x2="300" y2="456" class="arr" marker-end="url(#a)"/>

  <!-- Nœud 2 -->
  <rect x="580" y="110" width="520" height="410" rx="16" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="8 5"/>
  <text x="600" y="140" class="t" font-size="18" fill="#2c2c2a">Nœud 2</text>

  <rect x="760" y="160" width="200" height="64" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="1.5"/>
  <text x="860" y="186" text-anchor="middle" class="t" fill="#3c3489">Pod B</text>
  <text x="860" y="208" text-anchor="middle" class="ip" fill="#534ab7">10.244.2.7</text>

  <rect x="610" y="250" width="460" height="190" rx="12" fill="#f1efe8" stroke="#888780"/>
  <text x="626" y="272" class="s" fill="#5f5e5a">Namespace réseau de l'hôte</text>

  <rect x="730" y="286" width="260" height="60" rx="8" fill="#faeeda" stroke="#854f0b"/>
  <text x="860" y="311" text-anchor="middle" class="t" fill="#633806">Routage local</text>
  <text x="860" y="332" text-anchor="middle" class="s" fill="#854f0b">vers la veth du pod B</text>
  <g class="badge"><circle cx="1015" cy="316" r="11"/><text x="1015" y="320.5" text-anchor="middle">6</text></g>

  <rect x="730" y="366" width="260" height="60" rx="8" fill="#faeeda" stroke="#854f0b"/>
  <text x="860" y="391" text-anchor="middle" class="t" fill="#633806">Décapsulation</text>
  <text x="860" y="412" text-anchor="middle" class="s" fill="#854f0b">retrait de l'en-tête VXLAN</text>
  <g class="badge"><circle cx="1015" cy="396" r="11"/><text x="1015" y="400.5" text-anchor="middle">5</text></g>

  <rect x="760" y="460" width="200" height="44" rx="8" fill="#fff" stroke="#888780"/>
  <text x="860" y="487" text-anchor="middle" class="ip" fill="#2c2c2a">eth0 192.168.0.12</text>

  <line x1="860" y1="458" x2="860" y2="430" class="arr" marker-end="url(#a)"/>
  <line x1="860" y1="364" x2="860" y2="350" class="arr" marker-end="url(#a)"/>
  <line x1="860" y1="284" x2="860" y2="228" class="arr" marker-end="url(#a)"/>
  <text x="870" y="242" class="s" fill="#5f5e5a">veth</text>

  <!-- Réseau physique -->
  <path d="M300 506 L300 548 L860 548 L860 508" fill="none" stroke="#ba7517" stroke-width="1.8" stroke-dasharray="8 5" marker-end="url(#a)"/>
  <g class="badge"><circle cx="580" cy="548" r="11"/><text x="580" y="552.5" text-anchor="middle">4</text></g>
  <text x="580" y="580" text-anchor="middle" class="s" fill="#854f0b">Réseau physique : paquet UDP 192.168.0.11 → 192.168.0.12, le paquet pod → pod voyage à l'intérieur</text>

  <!-- Légende -->
  <text x="560" y="618" text-anchor="middle" class="s" fill="#616e7c">1 Résolution DNS · 2 DNAT vers un pod B · 3 Encapsulation · 4 Réseau physique · 5 Décapsulation · 6 Livraison au pod B</text>
  <text x="560" y="644" text-anchor="middle" class="s" fill="#616e7c">Retour : conntrack, sur le nœud 1, remet la ClusterIP 10.96.12.34 comme source de la réponse</text>
</svg>
