<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 495" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Chemin réseau d'une requête via un Ingress en réseau privé</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-size: 16px; font-weight: 700; }
      .s { font-size: 13.5px; }
      .ip { font-size: 13.5px; font-family: 'JetBrains Mono', Consolas, monospace; }
      .arr { stroke: #444441; stroke-width: 1.5; fill: none; }
      .badge circle { fill: #326ce5; }
      .badge text { fill: #fff; font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <!-- Réseau de l'entreprise -->
  <rect x="10" y="10" width="380" height="420" rx="16" fill="#e1f5ee" stroke="#0f6e56"/>
  <text x="30" y="42" class="t" font-size="18" fill="#085041">Réseau de l'entreprise · 10.0.0.0/8</text>
  <text x="30" y="64" class="s" fill="#0f6e56">Routé : visible depuis le poste</text>

  <rect x="30" y="100" width="150" height="64" rx="8" fill="#fff" stroke="#888780"/>
  <text x="105" y="126" text-anchor="middle" class="t" fill="#2c2c2a">Poste de l'agent</text>
  <text x="105" y="148" text-anchor="middle" class="ip" fill="#5f5e5a">10.20.4.37</text>

  <rect x="220" y="100" width="150" height="64" rx="8" fill="#fff" stroke="#888780"/>
  <text x="295" y="126" text-anchor="middle" class="t" fill="#2c2c2a">DNS interne</text>
  <text x="295" y="148" text-anchor="middle" class="s" fill="#5f5e5a">app.interne.fr → VIP</text>

  <line x1="182" y1="140" x2="216" y2="140" class="arr" marker-end="url(#a)"/>
  <g class="badge"><circle cx="200" cy="116" r="11"/><text x="200" y="120.5" text-anchor="middle">1</text></g>

  <rect x="60" y="208" width="300" height="72" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="1.5"/>
  <text x="210" y="238" text-anchor="middle" class="t" fill="#712b13">VIP ingress · 10.10.50.100</text>
  <text x="210" y="261" text-anchor="middle" class="s" fill="#993c1d">Service LoadBalancer (MetalLB)</text>

  <line x1="105" y1="166" x2="105" y2="204" class="arr" marker-end="url(#a)"/>
  <g class="badge"><circle cx="127" cy="186" r="11"/><text x="127" y="190.5" text-anchor="middle">2</text></g>

  <rect x="30" y="320" width="340" height="72" rx="8" fill="#fcebeb" stroke="#a32d2d" stroke-dasharray="6 4"/>
  <text x="200" y="350" text-anchor="middle" class="t" fill="#791f1f">curl 172.20.14.8 depuis le poste</text>
  <text x="200" y="373" text-anchor="middle" class="s" fill="#a32d2d">Aucune route : injoignable</text>

  <!-- Réseau du cluster -->
  <rect x="440" y="10" width="670" height="420" rx="16" fill="#eeedfe" stroke="#534ab7"/>
  <text x="460" y="42" class="t" font-size="18" fill="#3c3489">Réseau du cluster · overlay CNI</text>
  <text x="460" y="64" class="s" fill="#534ab7">Non routé depuis le poste · Pods 192.168.0.0/16 · Services 172.20.0.0/16</text>

  <line x1="362" y1="244" x2="466" y2="244" class="arr" marker-end="url(#a)"/>

  <rect x="470" y="208" width="200" height="72" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="1.5"/>
  <text x="570" y="238" text-anchor="middle" class="t" fill="#712b13">Ingress controller</text>
  <text x="570" y="261" text-anchor="middle" class="ip" fill="#993c1d">Pod 192.168.12.5</text>

  <path d="M672 244 L690 244 L690 158 L726 158" class="arr" marker-end="url(#a)"/>
  <path d="M690 244 L690 330 L726 330" class="arr" marker-end="url(#a)"/>
  <g class="badge"><circle cx="712" cy="244" r="11"/><text x="712" y="248.5" text-anchor="middle">3</text></g>

  <rect x="730" y="130" width="180" height="56" rx="8" fill="#fff" stroke="#888780"/>
  <text x="820" y="153" text-anchor="middle" class="t" fill="#2c2c2a">Service frontend</text>
  <text x="820" y="174" text-anchor="middle" class="ip" fill="#5f5e5a">172.20.14.8:80</text>

  <rect x="730" y="302" width="180" height="56" rx="8" fill="#fff" stroke="#888780"/>
  <text x="820" y="325" text-anchor="middle" class="t" fill="#2c2c2a">Service backend</text>
  <text x="820" y="346" text-anchor="middle" class="ip" fill="#5f5e5a">172.20.30.2:8080</text>

  <path d="M912 158 L925 158 L925 124 L941 124" class="arr" marker-end="url(#a)"/>
  <path d="M925 158 L925 192 L941 192" class="arr" marker-end="url(#a)"/>
  <path d="M912 330 L925 330 L925 296 L941 296" class="arr" marker-end="url(#a)"/>
  <path d="M925 330 L925 364 L941 364" class="arr" marker-end="url(#a)"/>
  <g class="badge"><circle cx="925" cy="244" r="11"/><text x="925" y="248.5" text-anchor="middle">4</text></g>

  <g fill="#fff" stroke="#888780">
    <rect x="945" y="96" width="150" height="56" rx="8"/>
    <rect x="945" y="164" width="150" height="56" rx="8"/>
    <rect x="945" y="268" width="150" height="56" rx="8"/>
    <rect x="945" y="336" width="150" height="56" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="1020" y="119" class="t" fill="#2c2c2a">frontend-a</text>
    <text x="1020" y="140" class="ip" fill="#5f5e5a">192.168.12.21</text>
    <text x="1020" y="187" class="t" fill="#2c2c2a">frontend-b</text>
    <text x="1020" y="208" class="ip" fill="#5f5e5a">192.168.47.9</text>
    <text x="1020" y="291" class="t" fill="#2c2c2a">backend-a</text>
    <text x="1020" y="312" class="ip" fill="#5f5e5a">192.168.12.33</text>
    <text x="1020" y="359" class="t" fill="#2c2c2a">backend-b</text>
    <text x="1020" y="380" class="ip" fill="#5f5e5a">192.168.47.14</text>
  </g>

  <!-- Frontière et légende -->
  <text x="415" y="455" text-anchor="middle" class="s" fill="#993c1d">Frontière : la VIP est portée par un nœud du cluster (10.10.50.11–13)</text>
  <text x="560" y="485" text-anchor="middle" class="s" fill="#616e7c">1 Résolution DNS · 2 HTTPS :443 vers la VIP · 3 Règle Ingress (Host, path) · 4 DNAT kube-proxy vers un Pod</text>
</svg>
