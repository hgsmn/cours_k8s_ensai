<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kubernetes : création d'un Pod</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(1100px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>.iso{--k-hot:#2f6fe4;--k-hot-soft:#2f6fe433;--k-screen:#1d2128;--k-screen-ink:#cfe0ff}
.iso[data-theme="dark"]{--k-hot:#6b9bff;--k-hot-soft:#6b9bff40;--k-screen:#0c0f14;--k-screen-ink:#cfe0ff}

.k-stage{outline:none;touch-action:pan-y}
.k-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.k8s-svg [data-part]{cursor:default}

/* traces: a faint channel, the copper line, and a hot overlay driven by live code */
.k-trace-bed{stroke:var(--anatomy-faint);stroke-width:2.6px;stroke-linecap:round}
.k-trace-hot{stroke:var(--k-hot);stroke-width:1.5px;opacity:0}
.k-packet-dot{fill:var(--k-hot)}
.k-packet-halo{fill:var(--k-hot);opacity:.18}
.k-port{stroke:var(--anatomy-mid)}
.k-link[data-hot] ~ * .k-port{stroke:var(--anatomy-mid)}

/* LEDs: --v is the brightness, 0..1 */
.k-glow{fill:url(#k-glow);opacity:var(--v,0);pointer-events:none}
.k-led .iso-top{fill:color-mix(in srgb,var(--k-hot) calc(var(--v,0) * 100%),var(--anatomy-top))}
.k-led .iso-edge{stroke:color-mix(in srgb,var(--k-hot) calc(var(--v,0) * 100%),var(--anatomy-mid))}

/* console screen */
.k-screen{fill:var(--k-screen)}
.k-term{opacity:var(--v,0)}
.k-term .iso-face-text{fill:var(--k-screen-ink)}

/* kube-proxy rule that appears, pod IP tag */
.k-rule{opacity:var(--v,0)}
.k-rule .iso-line{stroke:var(--k-hot);stroke-width:1px}
.k-ip[data-on] .iso-top{fill:var(--k-hot)}
.k-ip[data-on] .iso-edge{stroke:var(--k-hot)}

/* hover */
.k8s-svg [data-part][data-hover] .iso-edge{stroke:var(--k-hot)}

/* panel under the bench */
.k-panel{display:grid;gap:14px;margin-top:22px;padding-top:16px;border-top:1px solid var(--anatomy-faint)}
.k-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.k-btn,.k-step{appearance:none;border:0;background:var(--anatomy-paper);color:var(--anatomy-text);font:12px/1 var(--anatomy-mono);cursor:pointer;box-shadow:0 0 0 1px var(--anatomy-lo);border-radius:2px}
.k-btn{width:30px;height:28px}
.k-btn:hover,.k-step:hover{box-shadow:0 0 0 1px var(--anatomy-mid);color:var(--anatomy-strong)}
.k-btn:focus-visible,.k-step:focus-visible{outline:1px solid var(--k-hot);outline-offset:2px}
.k-play[data-playing]{color:var(--k-hot)}
.k-panel[data-playing] .k-play{color:var(--k-hot);box-shadow:0 0 0 1px var(--k-hot)}
.k-steps{display:flex;gap:4px;list-style:none;margin:0 0 0 10px;padding:0;flex-wrap:wrap}
.k-step{width:26px;height:24px;font-size:11px}
.k-step[data-done]{color:var(--anatomy-strong);box-shadow:0 0 0 1px var(--anatomy-mid)}
.k-step[aria-current]{background:var(--k-hot);color:#fff;box-shadow:0 0 0 1px var(--k-hot)}
.k-text{min-height:86px}
.k-title{display:flex;align-items:baseline;gap:10px;color:var(--anatomy-strong);font-size:16px;font-weight:600;letter-spacing:-.01em}
.k-num{font:12px/1 var(--anatomy-mono);color:var(--k-hot);min-width:18px}
.k-desc{margin:6px 0 0 28px;max-width:76ch;font-size:14px;line-height:1.6}
.k-info{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:10px 12px;background:var(--anatomy-page);font-size:13px;line-height:1.5;min-height:42px}
.k-info-name{font:12px/1.5 var(--anatomy-mono);color:var(--anatomy-muted);white-space:nowrap}
.k-panel[data-info] .k-info-name{color:var(--k-hot)}
@media (max-width:560px){.k-desc{margin-left:0}.k-steps{margin-left:0}}

/* Embedded in a slide (iframe ~1184 × 540): no scrolling. The bench fills the frame,
   the step text sits in the empty top-right of the drawing, the controls in the empty bottom-left. */
@media (max-height:640px) and (min-width:900px){
  html,body{height:100%;overflow:hidden}
  .iso-page{width:100%!important;margin:0!important;padding:0!important;height:100%}
  .iso-figure{margin:0;height:100%}
  .iso-legend{display:none}
  .iso-plate{height:100%;padding:0;box-shadow:none;display:flex;align-items:center;justify-content:center}
  .iso-plate-corners{inset:10px 14px}
  .iso-plate-corner[data-corner="title"]{display:none}
  .k-stage{width:100%;max-height:100%}
  .k-stage .iso-svg{width:100%;height:auto;max-height:calc(100vh - 20px);margin:0 auto}
  .k-panel{position:absolute;inset:0;margin:0;padding:0;border:0;pointer-events:none;display:block}
  .k-panel>*{pointer-events:auto}
  .k-controls{position:absolute;left:14px;bottom:34px;max-width:420px}
  .k-steps{margin-left:6px}
  .k-text{position:absolute;top:10px;right:14px;width:min(500px,44%);min-height:0;background:color-mix(in srgb,var(--anatomy-card) 88%,transparent);padding:2px 0 6px 10px}
  .k-title{font-size:15px}
  .k-desc{margin:4px 0 0 28px;font-size:13px;line-height:1.5}
  .k-info{position:absolute;right:14px;bottom:34px;width:min(520px,44%);min-height:0;padding:6px 10px;font-size:12px}
  .k-info-name{font-size:11px}
}

    if (p > -0.1 && p < 1.5) for (const part of ENDS[id]) on.add(part);
  }
  for (let i = used; i < pool.length; i++) pool[i].style.opacity = "0";
  for (const [id, link] of Object.entries(links)) {
    const v = hot[id] || 0;
    if (link.v !== v) { link.v = v; link.hot.style.opacity = v.toFixed(3); link.el.toggleAttribute("data-hot", v > 0.05); }
  }
  for (const [id, el] of Object.entries(parts)) setLit(el, on.has(id));
  // persistent state
  ["lamp0", "lamp1", "lamp2", "e0", "e1", "e2"].forEach((key) => leds[key]?.forEach((el) => css(el, st[key])));
  css(leds.knobled?.[0], st.knob);
  for (const n of [1, 2]) {
    for (const el of parts[`kubelet${n}`].querySelectorAll(".k-led")) css(el, on.has(`kubelet${n}`) ? 1 : 0.0);
    for (const el of parts[`crt${n}`].querySelectorAll(".k-led")) css(el, on.has(`crt${n}`) ? 1 : 0.0);
  }
  for (const [key, el] of Object.entries(terms)) css(el, st[key]);
  rules.forEach((el) => css(el, st[`rule${el.dataset.rule}`]));
  layers.forEach((el) => {
    const i = Number(el.dataset.layer);
    const v = i === 0 ? 1 : Math.min(1, Math.max(0, st.layers - i));
    el.style.opacity = v.toFixed(3);
    el.setAttribute("transform", shift(LIFT, (1 - v) * 18));
  });
  needle.setAttribute("d", needleAt(st.needle));
  pod.style.opacity = st.tray.toFixed(3);
  pod.setAttribute("transform", shift(LIFT, (1 - st.tray) * 26));
  css(ip, st.ip);
  ip.toggleAttribute("data-on", st.ip > 0.5);
  drawContainer(st.ctr * CTR.h);
  drawer.setAttribute("transform", shift(PULL, st.drawer * 8));
  setLit(knob, st.knob > 0.5);
  const text = `étape ${s}/${STEPS.length - 1} · ${step.phase}`;
  if (readout.textContent !== text) readout.textContent = text;
}

// ---------------------------------------------------------------- panel
const title = panel.querySelector(".k-title-t");
const num = panel.querySelector(".k-num");
const desc = panel.querySelector(".k-desc");
const pips = [...panel.querySelectorAll(".k-step")];
const playIcon = panel.querySelector(".k-play-i");
const infoName = panel.querySelector(".k-info-name");
const infoRole = panel.querySelector(".k-info-role");
function showStep(s) {
  num.textContent = String(s);
  title.textContent = STEPS[s].title;
  desc.textContent = STEPS[s].text;
  pips.forEach((el, i) => { el.toggleAttribute("data-done", i < s); i === s ? el.setAttribute("aria-current", "step") : el.removeAttribute("aria-current"); });
  stage.setAttribute("aria-description", `Étape ${s} : ${STEPS[s].title}. ${STEPS[s].text}`);
}

// ---------------------------------------------------------------- loop
let s = 0, t = 0, playing = !still.matches, visible = false, frame = 0, last = 0, shown = -1;
const DWELL = (i) => (i === 0 ? 3.5 : 5.2);
function go(next, { keepPlaying = false } = {}) {
  s = (next + STEPS.length) % STEPS.length;
  t = still.matches ? durationOf(s) : 0;
  if (!keepPlaying) setPlaying(false);
  run();
}
function setPlaying(v) {
  playing = v && !still.matches;
  playIcon.textContent = playing ? "❚❚" : "▶";
  panel.toggleAttribute("data-playing", playing);
  run();
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) * (window.__driveSpeed || 1) : 1 / 60;
  last = now;
  if (still.matches) t = durationOf(s);
  else t += dt;
  const end = durationOf(s) + 1.7;
  if (playing && t > durationOf(s) + DWELL(s)) { s = (s + 1) % STEPS.length; t = 0; }
  if (s !== shown) { shown = s; showStep(s); }
  draw(s, Math.min(t, end));
  const settled = !playing && t >= end;
  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}
function run() { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } }
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

panel.addEventListener("click", (event) => {
  const btn = event.target.closest("button");
  if (!btn) return;
  if (btn.dataset.step) go(Number(btn.dataset.step));
  else if (btn.dataset.act === "prev") go(s - 1);
  else if (btn.dataset.act === "next") go(s + 1);
  else if (btn.dataset.act === "play") { if (!playing && s === STEPS.length - 1 && t >= durationOf(s)) go(0, { keepPlaying: true }); setPlaying(!playing); }
});
stage.addEventListener("keydown", (event) => {
  if (event.key === "ArrowRight") go(s + 1);
  else if (event.key === "ArrowLeft") go(s - 1);
  else if (event.key === "Home") go(0);
  else if (event.key === "End") go(STEPS.length - 1);
  else if (event.key === " " || event.key === "Enter") setPlaying(!playing);
  else if (event.key === "r" || event.key === "R") go(s);
  else return;
  event.preventDefault();
});

// hover: name and role of the component under the pointer
let hovered = null;
function hover(id) {
  if (hovered === id) return;
  if (hovered && parts[hovered]) parts[hovered].removeAttribute("data-hover");
  hovered = id;
  if (id && parts[id] && PARTS[id]) {
    parts[id].setAttribute("data-hover", "");
    infoName.textContent = PARTS[id].name;
    infoRole.textContent = PARTS[id].role;
    panel.setAttribute("data-info", "");
  } else {
    infoName.textContent = "Survolez un composant";
    infoRole.textContent = "pour afficher son rôle dans le cluster.";
    panel.removeAttribute("data-info");
  }
}
svg.addEventListener("pointerover", (event) => hover(event.target.closest("[data-part]")?.dataset.part || null));
svg.addEventListener("pointerleave", () => hover(null));
svg.addEventListener("click", (event) => hover(event.target.closest("[data-part]")?.dataset.part || null));

showStep(0);
draw(0, 0);
setPlaying(playing);
</script></body></html>
