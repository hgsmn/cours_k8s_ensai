<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 550" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Chemin réseau complet d'un pod A vers un pod B situés sur le même nœud</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-size: 16px; font-weight: 700; }
      .s { font-size: 13.5px; }
      .ip { font-size: 13.5px; font-family: 'JetBrains Mono', Consolas, monospace; }
      .arr { stroke: #444441; stroke-width: 1.5; fill: none; }
      .badge circle { fill: #326ce5; }
      .badge text { fill: #fff; font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <!-- CoreDNS -->
  <rect x="440" y="16" width="240" height="68" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/>
  <text x="560" y="43" text-anchor="middle" class="t" fill="#085041">CoreDNS (kube-system)</text>
  <text x="560" y="66" text-anchor="middle" class="ip" fill="#0f6e56">svc-b → 10.96.12.34</text>
  <path d="M300 156 L300 50 L436 50" fill="none" stroke="#1d9e75" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#a)" marker-end="url(#a)"/>
  <g class="badge"><circle cx="370" cy="50" r="11"/><text x="370" y="54.5" text-anchor="middle">1</text></g>

  <!-- Nœud -->
  <rect x="20" y="110" width="1080" height="340" rx="16" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="8 5"/>
  <text x="40" y="140" class="t" font-size="18" fill="#2c2c2a">Nœud 1</text>

  <rect x="200" y="160" width="200" height="64" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="1.5"/>
  <text x="300" y="186" text-anchor="middle" class="t" fill="#3c3489">Pod A</text>
  <text x="300" y="208" text-anchor="middle" class="ip" fill="#534ab7">10.244.1.5</text>

  <rect x="720" y="160" width="200" height="64" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="1.5"/>
  <text x="820" y="186" text-anchor="middle" class="t" fill="#3c3489">Pod B</text>
  <text x="820" y="208" text-anchor="middle" class="ip" fill="#534ab7">10.244.1.9</text>

  <rect x="50" y="250" width="1020" height="170" rx="12" fill="#f1efe8" stroke="#888780"/>
  <text x="560" y="404" text-anchor="middle" class="s" fill="#5f5e5a">Namespace réseau de l'hôte</text>

  <rect x="170" y="296" width="260" height="60" rx="8" fill="#faeeda" stroke="#854f0b"/>
  <text x="300" y="321" text-anchor="middle" class="t" fill="#633806">DNAT (kube-proxy)</text>
  <text x="300" y="342" text-anchor="middle" class="ip" fill="#854f0b">10.96.12.34 → 10.244.1.9</text>
  <g class="badge"><circle cx="145" cy="326" r="11"/><text x="145" y="330.5" text-anchor="middle">2</text></g>

  <rect x="690" y="296" width="260" height="60" rx="8" fill="#faeeda" stroke="#854f0b"/>
  <text x="820" y="321" text-anchor="middle" class="t" fill="#633806">Bridge cni0</text>
  <text x="820" y="342" text-anchor="middle" class="s" fill="#854f0b">ou route /32 par pod (Calico)</text>

  <line x1="300" y1="226" x2="300" y2="292" class="arr" marker-end="url(#a)"/>
  <text x="310" y="244" class="s" fill="#5f5e5a">veth</text>
  <line x1="432" y1="326" x2="686" y2="326" class="arr" marker-end="url(#a)"/>
  <g class="badge"><circle cx="560" cy="326" r="11"/><text x="560" y="330.5" text-anchor="middle">3</text></g>
  <line x1="820" y1="294" x2="820" y2="228" class="arr" marker-end="url(#a)"/>
  <text x="830" y="244" class="s" fill="#5f5e5a">veth</text>

  <!-- Légende -->
  <text x="560" y="482" text-anchor="middle" class="s" fill="#993c1d">Ni encapsulation ni carte réseau physique : le paquet ne quitte jamais le nœud</text>
  <text x="560" y="512" text-anchor="middle" class="s" fill="#616e7c">1 Résolution DNS · 2 DNAT vers un pod B · 3 Livraison locale via le bridge</text>
  <text x="560" y="536" text-anchor="middle" class="s" fill="#616e7c">Retour : conntrack remet la ClusterIP 10.96.12.34 comme source de la réponse</text>
</svg>
