# Publie le site du cours sur GitHub Pages à chaque push sur main.
# À activer une fois : Settings → Pages → Source : « GitHub Actions ».
name: Publier le site du cours

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les outils
        run: |
          pip install -r requirements-docs.txt
          npm install -g @marp-team/marp-cli@4

      - name: Construire le site et les diapositives
        env:
          MARP: marp
        run: ./build.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
